name: Host SDK
on: [push, pull_request, workflow_dispatch]

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: >-
            git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy mingw-w64-ucrt-x86_64-python-pip
      - name: Build and test on Windows x64 (MinGW-w64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --workflow --preset host
      - name: Build and test on Linux or macOS
        if: runner.os != 'Windows'
        run: cmake --workflow --preset host
      - name: Verify firmware images and run native controller tests
        if: matrix.os == 'ubuntu-24.04'
        run: |
          (cd firmware/images && sha256sum -c SHA256SUMS)
          python3 firmware/tools/test-native.py
      - name: Reproduce firmware protocol from schema
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo run --locked --manifest-path third_party/wlc/Cargo.toml --target-dir build/wlc -- compile protocol/robot_messages.wl --profile protocol/board_rt.bind.wl --out-dir build/wlc-protocol
          diff -ru --exclude=value_init.h generated/protocol build/wlc-protocol

      - name: Build and exercise installed Linux wheel
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m venv build/wheel-env
          source build/wheel-env/bin/activate
          bash tools/ci/test-wheel.sh
      - name: Verify MuJoCo gravity, tracking and inter-arm clearance
        if: matrix.os == 'ubuntu-24.04'
        run: |
          source build/wheel-env/bin/activate
          python -m pip install 'mujoco>=3.2'
          python examples/mujoco_mocap_qp.py --headless
      - name: Build and exercise installed UCRT64 wheel
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -m venv --system-site-packages build/wheel-env
          source build/wheel-env/bin/activate || source build/wheel-env/Scripts/activate
          bash tools/ci/test-wheel.sh
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' || runner.os == 'Windows'
        with:
          name: python-wheel-${{ matrix.os }}
          path: build/wheels/*.whl
