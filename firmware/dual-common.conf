CONFIG_ROBOT_PEER_LINK=y
CONFIG_ROBOT_BOOT_HAND_FIRST=y
# Two SDK channels, peer, GELLO and CAN trace each need a UDP handler.
# Zephyr registers a receive handler even on a send-only trace socket.
CONFIG_NET_MAX_CONN=6
CONFIG_ETH_NXP_ENET_QOS_TX_OSF=n
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_ETH_NXP_ENET_QOS_RX_BUFFER_DESCRIPTORS=16
# Cortex-M33 primary core supports single-precision FPU; gravity runs locally.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
